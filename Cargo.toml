[package]
authors = ["Clemens Winter <clemenswinter1@gmail.com>"]
description = "Efficient RaggedBuffer datatype that implements 3D arrays with variable-length 2nd dimension."
edition = "2021"
license = "MIT OR Apache-2.0"
name = "ragged-buffer"
readme = "README.md"
repository = "https://github.com/entity-neural-network/ragged-buffer"
version = "0.4.8"

[lib]
crate-type = ["cdylib", "rlib"]
name = "ragged_buffer"

[dependencies]
ndarray = "0.17"
numpy = { version = "0.30", optional = true }
pyo3 = { version = "0.30", features = ["extension-module"], optional = true }

[profile.release]
debug = true

[features]
python = ["pyo3", "numpy"]
